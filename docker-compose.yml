version: "3.8"

networks:
  votaya-net:
    driver: bridge

services:
  # --- Backend Microservices ---

  auth-service:
    build: ./VotaYa-Backend/AuthService
    container_name: auth-service
    ports:
      - "8081:8081"
    networks:
      - votaya-net
    environment:
      SPRING_PROFILES_ACTIVE: docker

  voting-service:
    build: ./VotaYa-Backend/VotingService
    container_name: voting-service
    ports:
      - "8082:8082"
    networks:
      - votaya-net
    depends_on:
      - votaya-broker
    environment:
      SPRING_PROFILES_ACTIVE: docker
      RABBITMQ_HOST: votaya-broker

  ledger-service:
    build: ./VotaYa-Backend/LedgerService
    container_name: ledger-service
    ports:
      - "8083:8083"
    networks:
      - votaya-net
    depends_on:
      - votaya-broker
      - votaya-db
    environment:
      SPRING_PROFILES_ACTIVE: docker
      RABBITMQ_HOST: votaya-broker
      DB_HOST: votaya-db

  report-service:
    build: ./VotaYa-Backend/ReportService
    container_name: report-service
    ports:
      - "8084:8084"
    networks:
      - votaya-net
    depends_on:
      - votaya-db
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: votaya-db

  # --- Frontend Service ---

  frontend:
    build: ./VotaYa Digital Voting Platform
    container_name: frontend
    ports:
      - "3000:80"
    networks:
      - votaya-net

  # --- Infrastructure Services ---

  votaya-broker:
    image: rabbitmq:3.13-management-alpine
    container_name: votaya-broker
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - votaya-net
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  votaya-db:
    image: postgres:16-alpine
    container_name: votaya-db
    ports:
      - "5432:5432"
    networks:
      - votaya-net
    environment:
      POSTGRES_DB: votayadb
      POSTGRES_USER: votaya
      POSTGRES_PASSWORD: votayapass
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  rabbitmq-data:
  postgres-data:
