# render.yaml
# Deployment configuration for VotaYa on Render

services:
  # ---------- FRONTEND ----------
  - type: web
    name: frontend
    plan: free
    env: docker
    repo: https://github.com/Isaaidk/DeployPrueba.git
    branch: pruebadep
    dockerfilePath: Dockerfile
    dockerContext: VotaYa Digital Voting Platform
    envVars:
      - key: PORT
        value: 3000

  # ---------- AUTH SERVICE ----------
  - type: pserv
    name: auth-service
    plan: starter
    env: docker
    repo: https://github.com/Isaaidk/DeployPrueba.git
    branch: pruebadep
    dockerfilePath: Dockerfile
    dockerContext: VotaYa-Backend/AuthService
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: docker

  # ---------- VOTING SERVICE ----------
  - type: pserv
    name: voting-service
    plan: starter
    env: docker
    repo: https://github.com/Isaaidk/DeployPrueba.git
    branch: pruebadep
    dockerfilePath: Dockerfile
    dockerContext: VotaYa-Backend/VotingService
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: docker
      - key: RABBITMQ_HOST
        value: votaya-broker

  # ---------- LEDGER SERVICE ----------
  - type: pserv
    name: ledger-service
    plan: starter
    env: docker
    repo: https://github.com/Isaaidk/DeployPrueba.git
    branch: pruebadep
    dockerfilePath: Dockerfile
    dockerContext: VotaYa-Backend/LedgerService
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: docker
      - key: RABBITMQ_HOST
        value: votaya-broker
      - key: DB_HOST
        fromDatabase:
          name: votaya-db
          property: host

  # ---------- REPORT SERVICE ----------
  - type: pserv
    name: report-service
    plan: starter
    env: docker
    repo: https://github.com/Isaaidk/DeployPrueba.git
    branch: pruebadep
    dockerfilePath: Dockerfile
    dockerContext: VotaYa-Backend/ReportService
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: docker
      - key: DB_HOST
        fromDatabase:
          name: votaya-db
          property: host

  # ---------- RABBITMQ ----------
  - type: pserv
    name: votaya-broker
    plan: starter
    env: docker
    repo: https://github.com/Isaaidk/DeployPrueba.git
    branch: pruebadep
    dockerfilePath: Dockerfile
    dockerContext: VotaYa-Backend/RabbitMQ
    envVars:
      - key: RABBITMQ_DEFAULT_USER
        value: guest
      - key: RABBITMQ_DEFAULT_PASS
        value: guest

# ---------- POSTGRES DATABASE ----------
databases:
  - name: votaya-db
    databaseName: votayadb
    user: votaya
    plan: free